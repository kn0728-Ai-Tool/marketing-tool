# .streamlit/config.toml
# Streamlitのテーマ設定（ダークモード対応）

[theme]
base                = "light"
primaryColor        = "#6366f1"
backgroundColor     = "#f8fafc"
secondaryBackgroundColor = "#f1f5f9"
textColor           = "#1e293b"
font                = "sans serif"

[server]
headless            = true
enableCORS          = false
